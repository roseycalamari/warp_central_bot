name: Auto-publish due Instagram posts

# Wakes the Vercel app every 5 minutes so scheduled posts go out
# even when your laptop is off (Vercel Hobby can't cron every minute).
#
# One-time setup:
# GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#   Name:  PUBLISH_URL
#   Value: https://YOUR-APP.vercel.app/api/publish?secret=YOUR_CRON_SECRET
# (same CRON_SECRET as in Vercel env vars)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger publish endpoint
        env:
          PUBLISH_URL: ${{ secrets.PUBLISH_URL }}
        run: |
          if [ -z "$PUBLISH_URL" ]; then
            echo "Missing secret PUBLISH_URL. Add it under repo Settings → Secrets → Actions."
            exit 1
          fi
          echo "Calling publish endpoint..."
          # -f fails on HTTP errors; -S shows error; --max-time avoids hanging
          curl -fsS --max-time 55 -X GET "$PUBLISH_URL"
          echo ""
          echo "Done."
